# The gate: build, lint, test, on every push and every pull request. One job, because the whole
# check is seconds and a matrix would only make a failure harder to read.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # release.yml runs THIS file as its gate instead of repeating the steps: the release's gate and
  # every push's are the same one, or one of them lies.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: client

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: client

      # build, then lint, then test — the order matters and scripts/check is where it is written.
      - run: scripts/check
        working-directory: client
